        }
        .site-slogan {

        }

        .filter-btn { padding: 8px 20px; background: #ecf0f1; border: none; border-radius: 20px; cursor: pointer; font-size: 1rem; color: #555; transition: 0.3s; }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }

<!-- 🌟 统一 UI 组件：renderState() 状态组件 + dedupePosts() 去重函数 -->
<!-- =====================================================================
     统一 UI 组件（_partial/ui.ejs）—— 全站共用，只改这一个文件即可
=====================================================================
     本文件提供三个全局函数，被首页 / 分类页 / 百宝箱 / 搜索页引用：

     1. renderState(type, opts) —— 统一的"状态组件"（加载中 / 暂无数据 / 出错 / 404）
        type 取值：'loading' | 'empty' | 'error' | '404'
        opts 可填：{ icon, title, desc, btnText, btnLink }
        用法示例：
          container.innerHTML = renderState('empty', {
            icon: '📭', title: '暂无相关课件',
            desc: '换个分类看看吧', btnText: '返回首页', btnLink: '/'
          });

     2. dedupePosts(posts) —— 按文章的 path（唯一地址）去重
        作用：同一篇文章即使被数据源重复输出，每个列表也只显示一次。

     3. dedupePostsByTitle(posts) —— 🌟 新增：按"标题"去重
        作用：解决"同一课程发成了小班/中班/大班三篇文章"的问题。
        在【全部课件】视图下，同名课程只显示 1 个。
===================================================================== -->

<script>
  function renderState(type, opts) {
    opts = opts || {};

    var icon = '';
    var title = '';
    var desc = '';
    var btn = '';

    switch (type) {
      case 'loading':
        icon = '<div class="spinner"></div>';
        title = opts.title || '加载中...';
        desc = opts.desc || '正在加载内容，请稍候';
        break;

      case 'empty':
        icon = '<span class="state-icon">' + (opts.icon || '🗂️') + '</span>';
        title = opts.title || '暂无数据';
        desc = opts.desc || '这里暂时还没有内容';
        break;

      case 'error':
        icon = '<span class="state-icon">' + (opts.icon || '⚠️') + '</span>';
        title = opts.title || '出错了';
        desc = opts.desc || '加载失败，请刷新页面重试';
        break;

      case '404':
        icon = '<span class="state-icon">🔍</span>';
        title = opts.title || '404 - 页面不存在';
        desc = opts.desc || '您访问的页面不存在或已被删除';
        break;
    }

    if (opts.btnText && opts.btnLink) {
      btn = '<a class="state-btn" href="' + opts.btnLink + '">' + opts.btnText + '</a>';
    }

    return '<div class="state-block' + (type === '404' ? ' state-404' : '') + '">'
      + icon
      + '<h3>' + title + '</h3>'
      + '<p>' + desc + '</p>'
      + btn
      + '</div>';
  }

  function dedupePosts(posts) {
    var seen = new Set();
    var out = [];

    (posts || []).forEach(function (p) {
      var key = p.path || p.id || p.title; // 用文章地址作为唯一标识
      if (!seen.has(key)) {
        seen.add(key);
        out.push(p);
      }
    });

    return out;
  }

  // ================================================================
  // 🌟 新增：按"标题"去重（解决同一课程在 小班/中班/大班 重复显示的问题）
  //
  // 规则：
  //   1. 把标题里的空格、年级字样（小班/中班/大班/托班）、书名号引号
  //      全部去掉后，如果两篇文章的标题一样，就视为"同一门课程"。
  //   2. 同一门课程只保留 1 篇，优先级：
  //      ① 有封面图的优先  ② 日期更新的优先  ③ 都相同则保留先出现的
  //
  // ⚠️ 如果您发现有的课程被"误合并"了（两门不同的课被当成一门），
  //    说明它们的标题去掉年级后是一样的，请把这两篇的标题发给我调整规则。
  // ================================================================
  function dedupePostsByTitle(posts) {
    var map = {};      // key: 标准化后的标题, value: 当前保留的那篇
    var order = [];    // 记录出现顺序，保证列表输出顺序稳定
    var noTitle = [];  // 极少数没有标题的文章，直接保留，不去重

    (posts || []).forEach(function (p) {
      // ---------- 标题标准化：去掉空格、年级字样、书名号引号 ----------
      var key = (p.title || '')
        .replace(/\s+/g, '')                    // 去掉所有空格
        .replace(/(小班|中班|大班|托班)/g, '')   // 去掉年级字样
        .replace(/[《》【】""'']+/g, '');        // 去掉书名号、引号等装饰符号

      // 没有标题的文章无法判断，直接保留
      if (!key) {
        noTitle.push(p);
        return;
      }

      // 第一次出现：直接保留
      if (!map[key]) {
        map[key] = p;
        order.push(key);
        return;
      }

      // 已经出现过同名课程：按优先级决定保留哪一篇
      var kept = map[key];
      var challenger = p;

      // ① 有封面图的优先
      var keptHasCover = !!kept.cover_img;
      var chalHasCover = !!challenger.cover_img;
      if (chalHasCover && !keptHasCover) {
        map[key] = challenger;
        return;
      }
      if (keptHasCover && !chalHasCover) {
        return; // 已保留的有封面， challenger 没封面，不替换
      }

      // ② 日期新的优先（date 格式是 "YYYY-MM-DD"，字符串直接比较即可）
      if (challenger.date > kept.date) {
        map[key] = challenger;
      }
    });

    // 按最初出现的顺序输出
    var out = order.map(function (k) { return map[k]; });
    return out.concat(noTitle);
  }
</script>

    let currentPage = 1;
    const itemsPerPage = 12; 

    function renderCategoryPosts() {
        const container = document.getElementById('category-posts-container');
        container.innerHTML = '';

        try {
            const totalPages = Math.ceil(allPosts.length / itemsPerPage) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allPosts.slice(start, end);

            // 🌟 统一状态组件：暂无数据
            if (pageData.length === 0) {
                container.innerHTML = renderState('empty', {
                    icon: '📭',
                    title: '该分类下暂无课件',
                    desc: '可以去其他分类看看',
                    btnText: '返回首页',
                    btnLink: '/'
                });
            } else {
                pageData.forEach(post => {
                    const imgUrl = post.cover_img ? post.cover_img : 'https://via.placeholder.com/400x200?text=No+Image';
                    const html = `
                        <div class="post-card">
                            <div class="card-img-wrapper">
                                <img src="${imgUrl}" alt="${post.title}">
                            </div>
                            <div class="card-body">
                                <div class="card-title">
                                    <a href="${post.path}">${post.title}</a>
                                </div>
                                <div class="card-meta">
                                    <span>👁 ${post.views}</span>
                                    <span>📅 ${post.date}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            }

            document.getElementById('cat-page-info').textContent = `第 ${currentPage} 页`;
            document.getElementById('cat-prev-btn').disabled = currentPage === 1;
            document.getElementById('cat-next-btn').disabled = currentPage === totalPages;
        } catch (e) {
            // 🌟 统一状态组件：出错
            container.innerHTML = renderState('error', {
                title: '加载出错',
                desc: '数据加载失败，请刷新页面重试',
                btnText: '刷新页面',
                btnLink: 'javascript:location.reload()'
            });
        }
    }

    function changeCategoryPage(delta) {
        currentPage += delta;
        renderCategoryPosts();
        // 翻页后回到列表顶部
        window.scrollTo({ top: document.querySelector('.category-header').offsetTop - 20, behavior: 'smooth' });
    }

    renderCategoryPosts();
</script>

    <!-- 🌟 将运行时间JS移到这里（DOM加载后执行） -->
    <script>
        function updateRuntime() {
            // 🔴【重要】请在这里修改您的建站日期（格式：年/月/日 时:分:秒）
            var startTime = new Date('2014/04/04 09:05:40'); 
            
            // 获取当前时间
            var now = new Date();
            
            // 计算时间差（毫秒）
            var difference = now - startTime;
            
            // 计算天数、小时、分钟、秒
            var days = Math.floor(difference / (1000 * 60 * 60 * 24));
            var hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            var minutes = Math.floor((difference / (1000 * 60)) % 60);
            var seconds = Math.floor((difference / 1000) % 60);
            
            // 拼接字符串
            var result = days + "天" + 
                         hours + "小时" + 
                         minutes + "分钟" + 
                         seconds + "秒";
            
            // 更新网页显示
            document.getElementById('site-runtime').innerHTML = result;
        }

        // 立即执行一次，避免加载时有延迟
        updateRuntime();
        
        // 每隔 1 秒刷新一次
        setInterval(updateRuntime, 1000);
    </script>
