<!-- =====================================================================
     统一 UI 组件（_partial/ui.ejs）—— 全站共用，只改这一个文件即可
=====================================================================
     本文件提供三个全局函数，被首页 / 分类页 / 百宝箱 / 搜索页引用：

     1. renderState(type, opts) —— 统一的"状态组件"（加载中 / 暂无数据 / 出错 / 404）
        type 取值：'loading' | 'empty' | 'error' | '404'
        opts 可填：{ icon, title, desc, btnText, btnLink }
        用法示例：
          container.innerHTML = renderState('empty', {
            icon: '📭', title: '暂无相关课件',
            desc: '换个分类看看吧', btnText: '返回首页', btnLink: '/'
          });

     2. dedupePosts(posts) —— 按文章的 path（唯一地址）去重
        作用：同一篇文章即使被数据源重复输出，每个列表也只显示一次。

     3. dedupePostsByTitle(posts) —— 🌟 新增：按"标题"去重
        作用：解决"同一课程发成了小班/中班/大班三篇文章"的问题。
        在【全部课件】视图下，同名课程只显示 1 个。
===================================================================== -->

<script>
  function renderState(type, opts) {
    opts = opts || {};

    var icon = '';
    var title = '';
    var desc = '';
    var btn = '';

    switch (type) {
      case 'loading':
        icon = '<div class="spinner"></div>';
        title = opts.title || '加载中...';
        desc = opts.desc || '正在加载内容，请稍候';
        break;

      case 'empty':
        icon = '<span class="state-icon">' + (opts.icon || '🗂️') + '</span>';
        title = opts.title || '暂无数据';
        desc = opts.desc || '这里暂时还没有内容';
        break;

      case 'error':
        icon = '<span class="state-icon">' + (opts.icon || '⚠️') + '</span>';
        title = opts.title || '出错了';
        desc = opts.desc || '加载失败，请刷新页面重试';
        break;

      case '404':
        icon = '<span class="state-icon">🔍</span>';
        title = opts.title || '404 - 页面不存在';
        desc = opts.desc || '您访问的页面不存在或已被删除';
        break;
    }

    if (opts.btnText && opts.btnLink) {
      btn = '<a class="state-btn" href="' + opts.btnLink + '">' + opts.btnText + '</a>';
    }

    return '<div class="state-block' + (type === '404' ? ' state-404' : '') + '">'
      + icon
      + '<h3>' + title + '</h3>'
      + '<p>' + desc + '</p>'
      + btn
      + '</div>';
  }

  function dedupePosts(posts) {
    var seen = new Set();
    var out = [];

    (posts || []).forEach(function (p) {
      var key = p.path || p.id || p.title; // 用文章地址作为唯一标识
      if (!seen.has(key)) {
        seen.add(key);
        out.push(p);
      }
    });

    return out;
  }

  // ================================================================
  // 🌟 新增：按"标题"去重（解决同一课程在 小班/中班/大班 重复显示的问题）
  //
  // 规则：
  //   1. 把标题里的空格、年级字样（小班/中班/大班/托班）、书名号引号
  //      全部去掉后，如果两篇文章的标题一样，就视为"同一门课程"。
  //   2. 同一门课程只保留 1 篇，优先级：
  //      ① 有封面图的优先  ② 日期更新的优先  ③ 都相同则保留先出现的
  //
  // ⚠️ 如果您发现有的课程被"误合并"了（两门不同的课被当成一门），
  //    说明它们的标题去掉年级后是一样的，请把这两篇的标题发给我调整规则。
  // ================================================================
  function dedupePostsByTitle(posts) {
    var map = {};      // key: 标准化后的标题, value: 当前保留的那篇
    var order = [];    // 记录出现顺序，保证列表输出顺序稳定
    var noTitle = [];  // 极少数没有标题的文章，直接保留，不去重

    (posts || []).forEach(function (p) {
      // ---------- 标题标准化：去掉空格、年级字样、书名号引号 ----------
      var key = (p.title || '')
        .replace(/\s+/g, '')                    // 去掉所有空格
        .replace(/(小班|中班|大班|托班)/g, '')   // 去掉年级字样
        .replace(/[《》【】""'']+/g, '');        // 去掉书名号、引号等装饰符号

      // 没有标题的文章无法判断，直接保留
      if (!key) {
        noTitle.push(p);
        return;
      }

      // 第一次出现：直接保留
      if (!map[key]) {
        map[key] = p;
        order.push(key);
        return;
      }

      // 已经出现过同名课程：按优先级决定保留哪一篇
      var kept = map[key];
      var challenger = p;

      // ① 有封面图的优先
      var keptHasCover = !!kept.cover_img;
      var chalHasCover = !!challenger.cover_img;
      if (chalHasCover && !keptHasCover) {
        map[key] = challenger;
        return;
      }
      if (keptHasCover && !chalHasCover) {
        return; // 已保留的有封面， challenger 没封面，不替换
      }

      // ② 日期新的优先（date 格式是 "YYYY-MM-DD"，字符串直接比较即可）
      if (challenger.date > kept.date) {
        map[key] = challenger;
      }
    });

    // 按最初出现的顺序输出
    var out = order.map(function (k) { return map[k]; });
    return out.concat(noTitle);
  }
</script>

    const POSTS = allPosts.filter(p => (p.cats || []).indexOf(PAGE_ROOT) !== -1);

    // 文章是否匹配：主分类名 + 各筛选维度值都须出现在 cats 里
    function matchPost(p, mainKey, requiredCats) {
        const cats = p.cats || [];
        if (cats.indexOf(MAIN_NAME[mainKey]) === -1) return false;
        return requiredCats.every(c => cats.indexOf(c) !== -1);
    }

    function postCard(p, badge) {
        // 🌟 摘要可能带 HTML 标签（如 <!-- more --> 前的内容），展示前先去掉
        const desc = (p.excerpt || '').replace(/<[^>]+>/g, '').trim();
        return `<a class="result-card" href="${p.path}">
            <div class="badge">${badge}</div>
            <h4>${p.title}</h4>
            <p>${desc}</p>
            <div class="meta"><span>📅 ${p.date}</span></div>
        </a>`;
    }

    function emptyResult(icon, title, tip) {
        return `<div class="empty-state"><div class="icon">${icon}</div><h3>${title}</h3><p>${tip}</p></div>`;
    }

    function renderList(title, matched, badge) {
        if (matched.length === 0) return null;
        return `
            <div class="content-section-title">${title}（${matched.length} 篇）</div>
            <div class="grid-container">${matched.map(p => postCard(p, badge)).join('')}</div>`;
    }

    function init() {
        bindNavEvents();
        // 初始默认状态：节日活动 + 1-3月
        currentFilters['month'] = '1-3月';
        // 🌟 数据已在构建时注入，无需再异步加载，直接渲染
        renderFilters();
        renderContent();
    }

    function bindNavEvents() {
        mainNav.addEventListener('click', (e) => {
            const btn = e.target.closest('.main-category-btn');
            if (!btn) return;
            document.querySelectorAll('.main-category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentCategory = btn.dataset.category;
            currentFilters = {}; // 重置筛选

            // 默认值以便用户能看到初始界面
            if (currentCategory === 'festival') currentFilters['month'] = '1-3月';
            if (currentCategory === 'theme') currentFilters['class'] = '小班';
            if (currentCategory === 'feature') currentFilters['class'] = '小班';

            renderFilters();
            renderContent();
        });
    }

    // ================= 渲染筛选区 =================
    function renderFilters() {
        filtersContainer.innerHTML = '';
        filtersContainer.style.display = '';

        // --- 节日活动筛选逻辑 ---
        if (currentCategory === 'festival') {
            // 1. 月份
            const monthGroup = document.createElement('div'); monthGroup.className = 'filter-group';
            monthGroup.innerHTML = `<div class="filter-label">月份</div><div class="filter-options" id="monthOptions"></div>`;
            const monthOptions = monthGroup.querySelector('#monthOptions');
            Object.keys(festivalData).forEach(month => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentFilters['month'] === month ? 'active' : ''}`;
                btn.innerText = month;
                btn.onclick = () => { currentFilters['month'] = month; delete currentFilters['festivalId']; delete currentFilters['festivalName']; renderFilters(); renderContent(); };
                monthOptions.appendChild(btn);
            });
            filtersContainer.appendChild(monthGroup);

            // 2. 节日标签
            if (currentFilters['month']) {
                const festivalGroup = document.createElement('div'); festivalGroup.className = 'filter-group';
                festivalGroup.innerHTML = `<div class="filter-label">节日</div><div class="filter-options" id="festivalOptions"></div>`;
                const festivalOptions = festivalGroup.querySelector('#festivalOptions');
                festivalData[currentFilters['month']].forEach(item => {
                    const tag = document.createElement('button');
                    tag.className = `theme-tag ${currentFilters['festivalId'] === item.id ? 'active' : ''}`;
                    tag.innerHTML = `<span class="tag-icon">${item.icon}</span> ${item.name}`;
                    tag.onclick = () => { currentFilters['festivalId'] = item.id; currentFilters['festivalName'] = item.name; renderFilters(); renderContent(); };
                    festivalOptions.appendChild(tag);
                });
                filtersContainer.appendChild(festivalGroup);
            }

            // 3. 班级
            const classGroup = document.createElement('div'); classGroup.className = 'filter-group';
            classGroup.innerHTML = `<div class="filter-label">班级</div><div class="filter-options" id="classOptions"></div>`;
            const classOptions = classGroup.querySelector('#classOptions');
            ['小班', '中班', '大班'].forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentFilters['class'] === cls ? 'active' : ''}`;
                btn.innerText = cls;
                btn.onclick = () => { currentFilters['class'] = cls; renderFilters(); renderContent(); };
                classOptions.appendChild(btn);
            });
            filtersContainer.appendChild(classGroup);
            return;
        }

        // --- 主题活动筛选逻辑 (班级 -> 分类 -> 主题) ---
        if (currentCategory === 'theme') {
            // 1. 班级筛选
            const classGroup = document.createElement('div'); classGroup.className = 'filter-group';
            classGroup.innerHTML = `<div class="filter-label">班级</div><div class="filter-options" id="classOptionsTheme"></div>`;
            const classOptions = classGroup.querySelector('#classOptionsTheme');
            ['小班', '中班', '大班'].forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentFilters['class'] === cls ? 'active' : ''}`;
                btn.innerText = cls;
                btn.onclick = () => {
                    currentFilters['class'] = cls;
                    delete currentFilters['themeId'];
                    delete currentFilters['section'];
                    renderFilters(); renderContent();
                };
                classOptions.appendChild(btn);
            });
            filtersContainer.appendChild(classGroup);

            // 2. 分类筛选 (经典/探究)
            if (currentFilters['class']) {
                const availableSections = Object.keys(themeData[currentFilters['class']]);
                const sectionGroup = document.createElement('div'); sectionGroup.className = 'filter-group';
                sectionGroup.innerHTML = `<div class="filter-label">分类</div><div class="filter-options" id="sectionOptions"></div>`;
                const sectionOptions = sectionGroup.querySelector('#sectionOptions');
                availableSections.forEach(sec => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${currentFilters['section'] === sec ? 'active' : ''}`;
                    btn.innerText = sec;
                    btn.onclick = () => {
                        currentFilters['section'] = sec;
                        delete currentFilters['themeId'];
                        renderFilters(); renderContent();
                    };
                    sectionOptions.appendChild(btn);
                });
                filtersContainer.appendChild(sectionGroup);
            }

            // 3. 具体主题标签
            if (currentFilters['class'] && currentFilters['section']) {
                const themeGroup = document.createElement('div'); themeGroup.className = 'filter-group';
                themeGroup.innerHTML = `<div class="filter-label">主题</div><div class="filter-options" id="themeOptions"></div>`;
                const themeOptions = themeGroup.querySelector('#themeOptions');

                const themes = themeData[currentFilters['class']][currentFilters['section']];
                themes.forEach(item => {
                    const tag = document.createElement('button');
                    tag.className = `theme-tag ${currentFilters['themeId'] === item.id ? 'active' : ''}`;
                    tag.innerHTML = `<span class="tag-icon">${item.icon}</span> ${item.name}`;
                    tag.onclick = () => {
                        currentFilters['themeId'] = item.id;
                        currentFilters['themeName'] = item.name;
                        renderFilters(); renderContent();
                    };
                    themeOptions.appendChild(tag);
                });
                filtersContainer.appendChild(themeGroup);
            }
            return;
        }

        // --- 特色活动筛选逻辑 (仅保留 班级 -> 分类，去除三级筛选) ---
        if (currentCategory === 'feature') {
            // 1. 班级筛选
            const classGroup = document.createElement('div'); classGroup.className = 'filter-group';
            classGroup.innerHTML = `<div class="filter-label">班级</div><div class="filter-options" id="classOptionsFeature"></div>`;
            const classOptions = classGroup.querySelector('#classOptionsFeature');
            ['小班', '中班', '大班'].forEach(cls => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentFilters['class'] === cls ? 'active' : ''}`;
                btn.innerText = cls;
                btn.onclick = () => {
                    currentFilters['class'] = cls;
                    delete currentFilters['featureCatId'];
                    delete currentFilters['featureCatName'];
                    renderFilters(); renderContent();
                };
                classOptions.appendChild(btn);
            });
            filtersContainer.appendChild(classGroup);

            // 2. 分类筛选（二级分类）- 去除第三级具体活动
            if (currentFilters['class']) {
                const catGroup = document.createElement('div'); catGroup.className = 'filter-group';
                catGroup.innerHTML = `<div class="filter-label">分类</div><div class="filter-options" id="featureCatOptions"></div>`;
                const catOptions = catGroup.querySelector('#featureCatOptions');
                featureCategories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${currentFilters['featureCatId'] === cat.id ? 'active' : ''}`;
                    btn.innerText = cat.name;
                    btn.onclick = () => {
                        currentFilters['featureCatId'] = cat.id;
                        currentFilters['featureCatName'] = cat.name;
                        renderFilters(); renderContent();
                    };
                    catOptions.appendChild(btn);
                });
                filtersContainer.appendChild(catGroup);
            }
            return;
        }

        // --- 其他基础分类 (数学、科学、古诗等) ---
        const filters = baseData[currentCategory].filters;
        if (filters && filters.length > 0) {
            filters.forEach((filterGroup) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'filter-group';
                groupDiv.innerHTML = `<div class="filter-label">${filterGroup.name}</div><div class="filter-options"></div>`;
                const optionsDiv = groupDiv.querySelector('.filter-options');
                filterGroup.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${currentFilters[filterGroup.name] === option ? 'active' : ''}`;
                    btn.innerText = option;
                    btn.onclick = () => {
                        if (currentFilters[filterGroup.name] === option) delete currentFilters[filterGroup.name];
                        else currentFilters[filterGroup.name] = option;
                        renderFilters(); renderContent();
                    };
                    optionsDiv.appendChild(btn);
                });
                filtersContainer.appendChild(groupDiv);
            });
        } else {
            filtersContainer.style.display = 'none';
        }
    }

    // ================= 渲染结果区 =================
    function renderContent() {
        contentArea.innerHTML = '';

        // --- 1. 节日活动结果 ---
        if (currentCategory === 'festival') {
            const { festivalId, festivalName, class: selectedClass, month } = currentFilters;
            if (!festivalId || !selectedClass) {
                contentArea.innerHTML = emptyResult('🎯', '请先在上方选择「节日」和「班级」', '选定条件后，下方将展示对应的文章');
                return;
            }
            const matched = POSTS.filter(p => matchPost(p, 'festival', [month, festivalName, selectedClass]));
            if (matched.length === 0) {
                contentArea.innerHTML = emptyResult('📭', `暂无「${festivalName} · ${selectedClass}」的文章`, `请检查文章 categories 是否包含：${PAGE_ROOT}、${MAIN_NAME.festival}、${month}、${festivalName}、${selectedClass}`);
                return;
            }
            contentArea.innerHTML = renderList(`${festivalName} · ${selectedClass}`, matched, selectedClass);
            return;
        }

        // --- 2. 主题活动结果 ---
        if (currentCategory === 'theme') {
            const { themeId, themeName, class: selectedClass, section } = currentFilters;

            if (!themeId || !selectedClass || !section) {
                contentArea.innerHTML = emptyResult('🎯', '请先完成「班级」→「分类」→「主题」的选择', '选定条件后，下方将展示该主题的文章');
                return;
            }

            const matched = POSTS.filter(p => matchPost(p, 'theme', [selectedClass, section, themeName]));
            if (matched.length === 0) {
                contentArea.innerHTML = emptyResult('📭', `暂无「${selectedClass} · ${section} · ${themeName}」的文章`, `请检查文章 categories 是否包含：${PAGE_ROOT}、${MAIN_NAME.theme}、${selectedClass}、${section}、${themeName}`);
                return;
            }
            contentArea.innerHTML = renderList(`${selectedClass} · ${section} · ${themeName}`, matched, selectedClass);
            return;
        }

        // --- 3. 特色活动结果 (仅需班级和分类) ---
        if (currentCategory === 'feature') {
            const { class: selectedClass, featureCatName } = currentFilters;

            if (!selectedClass || !featureCatName) {
                contentArea.innerHTML = emptyResult('✨', '请先完成「班级」→「分类」的选择', '选定条件后，下方将展示对应的特色活动文章');
                return;
            }

            const matched = POSTS.filter(p => matchPost(p, 'feature', [selectedClass, featureCatName]));
            if (matched.length === 0) {
                contentArea.innerHTML = emptyResult('📭', `暂无「${selectedClass} · ${featureCatName}」的文章`, `请检查文章 categories 是否包含：${PAGE_ROOT}、${MAIN_NAME.feature}、${selectedClass}、${featureCatName}`);
                return;
            }
            contentArea.innerHTML = renderList(`${selectedClass} · ${featureCatName}`, matched, selectedClass);
            return;
        }

        // --- 4. 古诗结果 ---
        if (currentCategory === 'poetry') {
            const selectedClass = currentFilters['班级'];
            if (!selectedClass) {
                contentArea.innerHTML = emptyResult('📜', '请选择班级', '选择小班、中班或大班，查看对应的古诗文章');
                return;
            }
            const matched = POSTS.filter(p => matchPost(p, 'poetry', [selectedClass]));
            if (matched.length === 0) {
                contentArea.innerHTML = emptyResult('📭', `暂无「${selectedClass}」的古诗文章`, `请检查文章 categories 是否包含：${PAGE_ROOT}、${MAIN_NAME.poetry}、${selectedClass}`);
                return;
            }
            contentArea.innerHTML = renderList(`${selectedClass} 经典古诗`, matched, selectedClass);
            return;
        }

        // --- 5. 其他基础分类（情景数学 / 玩起来！科学 / 闪烁中国 / 地方特色） ---
        const requiredNames = baseData[currentCategory].filters.map(f => f.name);
        const requiredValues = requiredNames.map(n => currentFilters[n]);
        if (requiredValues.some(v => !v)) {
            contentArea.innerHTML = emptyResult('🔍', '请选择完整的筛选条件', '选择上方的选项，即可精准匹配文章');
            return;
        }
        const matched = POSTS.filter(p => matchPost(p, currentCategory, requiredValues));
        if (matched.length === 0) {
            contentArea.innerHTML = emptyResult('📭', `暂无「${requiredValues.join(' · ')}」的文章`, `请检查文章 categories 是否包含：${[PAGE_ROOT, MAIN_NAME[currentCategory]].concat(requiredValues).join('、')}`);
            return;
        }
        contentArea.innerHTML = renderList(requiredValues.join(' · '), matched, requiredValues[0]);
    }

    init();
</script>

    <!-- 🌟 将运行时间JS移到这里（DOM加载后执行） -->
    <script>
        function updateRuntime() {
            // 🔴【重要】请在这里修改您的建站日期（格式：年/月/日 时:分:秒）
            var startTime = new Date('2014/04/04 09:05:40'); 
            
            // 获取当前时间
            var now = new Date();
            
            // 计算时间差（毫秒）
            var difference = now - startTime;
            
            // 计算天数、小时、分钟、秒
            var days = Math.floor(difference / (1000 * 60 * 60 * 24));
            var hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            var minutes = Math.floor((difference / (1000 * 60)) % 60);
            var seconds = Math.floor((difference / 1000) % 60);
            
            // 拼接字符串
            var result = days + "天" + 
                         hours + "小时" + 
                         minutes + "分钟" + 
                         seconds + "秒";
            
            // 更新网页显示
            document.getElementById('site-runtime').innerHTML = result;
        }

        // 立即执行一次，避免加载时有延迟
        updateRuntime();
        
        // 每隔 1 秒刷新一次
        setInterval(updateRuntime, 1000);
    </script>
